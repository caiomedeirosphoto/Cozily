<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozily</title>
<meta name="description" content="Tudo do nosso AP, item por item.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cozily">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1110" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --ink:#17181A; --ink2:#2C2E2A; --muted:#5E625C; --faint:#8A8E87;
  --line:#E4E2DC; --soft:#ECEAE4; --field:#FFFFFF; --overlay:rgba(23,24,26,.45);
  --accent:#2E6A4F; --accent-ink:#FFFFFF; --accent-text:#2E6A4F; --accent-soft:#DCEBE2;
  --deep:#1F4A37; --deep-ink:#FFFFFF; --deep-muted:#C7E3D2; --ring:#9FD8B5; --key:#F2C48D;
  --amber:#9A5516; --amber-soft:#F6E7D6; --amber-ink:#7A3F0E; --amber-deep:#3D2208;
  --blue:#2D5A8A; --blue-soft:#DCE6F2; --blue-ink:#24507D;
  --purple:#5B4A86; --purple-soft:#E7E1F1; --purple-ink:#4E3F78;
  --danger:#B23A2E;
  --shadow:0 1px 2px rgba(23,24,26,.04), 0 6px 20px rgba(23,24,26,.05);
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1110; --card:#1A1C1A; --ink:#EDEDEA; --ink2:#D9DAD5; --muted:#A3A79F; --faint:#7D817A;
    --line:#2A2D2A; --soft:#272A27; --field:#141614; --overlay:rgba(0,0,0,.6);
    --accent:#2F7A55; --accent-ink:#FFFFFF; --accent-text:#8FD1AC; --accent-soft:#1E3A2C;
    --deep:#16382A; --deep-muted:#A9D5BC;
    --amber:#E0A262; --amber-soft:#3A2A19; --amber-ink:#F0C08E; --amber-deep:#F6DDBF;
    --blue:#7EA9D6; --blue-soft:#1C2C3D; --blue-ink:#A9C8EA;
    --purple:#AE9CDB; --purple-soft:#2A2440; --purple-ink:#C9BCEB;
    --danger:#F08A7E;
    --shadow:none;
    color-scheme:dark;
  }
}
/* cômodos */
.c-green{--tint:#DCEBE2;--tone:#2E6A4F}
.c-lilac{--tint:#E7E1F1;--tone:#5B4A86}
.c-blue{--tint:#DCE6F2;--tone:#2D5A8A}
.c-rose{--tint:#F3DEDB;--tone:#8A3E36}
.c-teal{--tint:#D8ECEC;--tone:#23706F}
.c-sand{--tint:#F1E9D8;--tone:#7A5B22}
.c-grey{--tint:#E6E6E3;--tone:#4B4F4A}
.c-ochre{--tint:#EEE5D2;--tone:#6B5527}
@media (prefers-color-scheme: dark){
  .c-green{--tint:#1E3A2C;--tone:#8FD1AC}
  .c-lilac{--tint:#2A2440;--tone:#C3B5EA}
  .c-blue{--tint:#1C2C3D;--tone:#9CC2EA}
  .c-rose{--tint:#3A2220;--tone:#EBA79E}
  .c-teal{--tint:#163433;--tone:#86D1CF}
  .c-sand{--tint:#33291A;--tone:#E1C38A}
  .c-grey{--tint:#2A2C2A;--tone:#C4C7C0}
  .c-ochre{--tint:#312A1B;--tone:#D9C08E}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
a{color:var(--accent-text);text-decoration:none}
img{display:block}
.h-display{font-family:Sora,Figtree,sans-serif;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.page{padding:calc(var(--top) + 14px) 20px calc(var(--bottom) + 112px);display:flex;flex-direction:column;gap:18px}
.page.no-tabs{padding-bottom:calc(var(--bottom) + 40px)}
.enter-fade{animation:fadeUp .38s var(--ease) both}
.enter-push{animation:pushIn .42s var(--ease) both}
.enter-pop{animation:popIn .42s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

/* topo */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.hello{display:flex;flex-direction:column;gap:2px}
.hello small{font-size:14px;color:var(--muted);font-weight:500}
.hello h1{margin:0;font-size:30px;font-weight:700;line-height:1.1}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.solid{background:var(--accent);color:var(--accent-ink)}
.row-gap{display:flex;gap:8px}

/* hero */
.hero{background:var(--deep);border-radius:26px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:108px;height:108px;flex:none}
.ring svg{width:108px;height:108px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .track{stroke:rgba(255,255,255,.16)}
.ring .arc{stroke:var(--ring);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label b{font-family:Sora,Figtree,system-ui,sans-serif;font-size:27px;line-height:1}
.ring-label span{font-size:12px;color:var(--deep-muted);margin-top:3px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv small{font-size:11px;color:var(--deep-muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.kv b{font-family:Sora,Figtree,system-ui,sans-serif;font-size:20px;font-weight:600}
.keys{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.keys span:first-child{display:flex;align-items:center;gap:7px;font-weight:600}
.keys span:last-child{color:var(--deep-muted)}

/* etapa card */
.next{background:var(--amber-soft);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;color:var(--amber-deep)}
.next .eyebrow{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--amber-ink);text-transform:uppercase;letter-spacing:.08em}
.next b{font-family:Sora,Figtree,system-ui,sans-serif;font-size:19px}
.next p{margin:0;font-size:13px;color:var(--amber-ink)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--tone,var(--accent));width:0;transition:width .9s var(--ease)}
.next .bar{background:rgba(154,85,22,.18)}
.next .bar>i{background:var(--amber)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
.sec-h h2{margin:0;font-family:Sora,Figtree,system-ui,sans-serif;font-size:18px;font-weight:600}
.sec-h span,.sec-h a{font-size:13px;color:var(--muted);font-weight:600}
.sec-h a{color:var(--accent-text)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.room-card{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--ink);box-shadow:var(--shadow);transition:transform .18s var(--ease)}
.room-card:active{transform:scale(.97)}
.room-card .top{display:flex;justify-content:space-between;align-items:flex-start}
.room-card .count{font-size:13px;font-weight:600;color:var(--muted)}
.room-card .name{font-weight:700;font-size:16px}
.tile{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--tone);display:inline-flex;align-items:center;justify-content:center;flex:none}
.tile.lg{width:56px;height:56px;border-radius:18px}

.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.list-link{display:flex;align-items:center;gap:12px;padding:14px;color:var(--ink)}
.list-link+.list-link{border-top:1px solid var(--soft)}
.list-link .grow{flex:1;font-weight:700}
.list-link .count{font-size:13px;color:var(--muted);font-weight:600}

/* cômodo */
.room-hero{display:flex;flex-direction:column;gap:14px}
.room-hero .t{display:flex;align-items:center;gap:14px}
.room-hero h1{margin:0;font-size:28px;font-weight:700;line-height:1.15}
.room-hero p{margin:2px 0 0;color:var(--muted);font-size:14px}
.room-hero .bar{height:8px;border-radius:4px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:38px;border-radius:11px;font-size:14px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}
.chip small{font-size:12px;opacity:.7}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.group-h h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.group-h span{font-size:13px;color:var(--muted);font-weight:600}
.items{background:var(--card);border-radius:20px;padding:4px 0;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;position:relative}
.item+.item::before{content:"";position:absolute;left:72px;right:0;top:0;border-top:1px solid var(--soft)}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;color:var(--ink);padding:4px 0}
.thumb{width:46px;height:46px;border-radius:14px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-text)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.empty{background:transparent;border:1.5px dashed var(--line);color:var(--faint)}
.item-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .item-name{color:var(--muted)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap}
.meta .dot{width:8px;height:8px;border-radius:50%;background:var(--tone);flex:none}
.meta .room{font-weight:700;color:var(--tone)}
.pill{font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap}
.e1{color:var(--amber-ink);background:var(--amber-soft)}
.e2{color:var(--blue-ink);background:var(--blue-soft)}
.e3{color:var(--purple-ink);background:var(--purple-soft)}
.chk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,border-color .2s}
.item.done .chk span{background:var(--accent);border-color:var(--accent)}
.chk svg{opacity:0;transform:scale(.5);transition:opacity .2s,transform .25s var(--ease)}
.item.done .chk svg{opacity:1;transform:none}
.pop .chk span{animation:chkPop .45s var(--ease)}
@keyframes chkPop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.empty-state{text-align:center;color:var(--muted);padding:34px 20px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-state b{color:var(--ink);font-size:16px}

/* detalhe */
.photo-wrap{position:relative;margin:calc(-1 * (var(--top) + 14px)) -20px 0;height:calc(var(--top) + 330px);background:var(--accent-soft)}
.photos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.photo-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--accent-text);padding-top:var(--top)}
.photo-empty button{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);min-height:44px;padding:0 18px;border-radius:22px;font-weight:700;font-size:15px}
.float-bar{position:absolute;left:20px;right:20px;top:calc(var(--top) + 12px);display:flex;justify-content:space-between}
.dots{position:absolute;bottom:42px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.6);transition:width .25s}
.dots i.on{width:18px;background:#fff}
.sheet-card{margin:-28px -20px 0;background:var(--bg);border-radius:28px 28px 0 0;position:relative;padding:22px 20px 0;display:flex;flex-direction:column;gap:18px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills .pill{font-size:12px;padding:5px 10px;border-radius:10px}
.pill.room{background:var(--tint);color:var(--tone)}
.detail-title{margin:0;font-size:26px;font-weight:700;line-height:1.2}
.status-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);transition:transform .15s,background .25s}
.status-btn:active{transform:scale(.98)}
.status-btn.is-done{background:var(--accent-soft);color:var(--accent-text)}
.price{background:var(--card);border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;box-shadow:var(--shadow)}
.price small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.price b{font-family:Sora,Figtree,system-ui,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;display:block}
.price .side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--muted);text-align:right}
.price .save{font-weight:700;color:var(--accent-text)}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.info div{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.info small{font-size:12px;color:var(--muted);font-weight:600}
.info b{font-size:15px;overflow-wrap:anywhere}
.notes small{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.notes p{margin:6px 0 0;font-size:15px;line-height:1.5;color:var(--ink2);white-space:pre-wrap}
.btn{min-height:52px;border-radius:16px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.danger{color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.6}

/* ordem */
.stage{width:100%;text-align:left;border:2px solid transparent;background:var(--card);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.stage .num{width:40px;height:40px;border-radius:12px;color:#fff;font-family:Sora,Figtree,system-ui,sans-serif;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.stage .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.stage .body span{display:flex;justify-content:space-between;gap:8px}
.stage .body b{font-size:16px}
.stage .bar{display:block}
.stage .body small{font-size:13px;font-weight:700;color:var(--muted)}
.s1 .num,.s1 .bar>i{background:var(--amber)} .s1[aria-pressed=true]{border-color:var(--amber);background:var(--amber-soft)}
.s2 .num,.s2 .bar>i{background:var(--blue)} .s2[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft)}
.s3 .num,.s3 .bar>i{background:var(--purple)} .s3[aria-pressed=true]{border-color:var(--purple);background:var(--purple-soft)}
@media (prefers-color-scheme: dark){.stage .num{color:#141614}}
.tip{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.tip .tile{width:32px;height:32px;border-radius:10px;background:var(--amber-soft);color:var(--amber)}
.tip p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}

/* gastos */
.card{background:var(--card);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:15px;font-weight:700}
.total small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.total .big{font-family:Sora,Figtree,system-ui,sans-serif;font-size:32px;font-weight:700;letter-spacing:-.02em;display:block}
.split{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--soft);padding-top:10px}
.split b{color:var(--ink)}
.months{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:150px;overflow-x:auto;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mbar{flex:1 0 38px;max-width:64px;height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.mbar i{display:block;width:100%;border-radius:8px;background:var(--accent-soft);transition:height .8s var(--ease),background .2s;min-height:6px}
.mbar[aria-pressed=true] i{background:var(--accent)}
.mbar span{font-size:12px;font-weight:600;color:var(--muted)}
.hrow{display:flex;flex-direction:column;gap:5px}
.hrow div:first-child{display:flex;justify-content:space-between;font-size:13px}
.hrow div:first-child span:first-child{font-weight:600}
.buy{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--soft)}
.buy span:last-child{font-weight:700;white-space:nowrap}

/* busca */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;min-height:50px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:16px;min-height:48px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;transition:transform .35s var(--ease)}
.tabbar.hide{transform:translateY(130%)}

/* lista sugerida para uma conta nova: nada vem marcado como comprado */
function buildSeedFor(rooms) {
  const out = [], used = new Set();
  let ordem = 0;
  for (const r of rooms) {
    for (const [, topico, list] of seedRowsFor(r.tipo)) {
      for (const raw of list) {
        const { nome, etapa } = parseSeedName(raw);
        let id = `${r.id}--${slug(topico || "geral")}--${slug(nome)}`;
        while (used.has(id)) id += "-2";
        used.add(id);
        out.push({ id, nome, comodo: r.id, topico, comprado: false, etapa, ordem: ordem++, criadoEm: Date.now() });
      }
    }
  }
  return out;
}

function buildSeed() {
  const out = [], used = new Set();
  let ordem = 0;
  for (const [comodo, topico, list] of SEED) {
    for (let raw of list) {
      const comprado = raw.startsWith("+");
      if (comprado) raw = raw.slice(1);
      let etapa = 0;
      const m = raw.match(/#(\d)$/);
      if (m) { etapa = +m[1]; raw = raw.slice(0, -2); }
      let id = `${comodo}--${slug(topico || "geral")}--${slug(raw)}`;
      while (used.has(id)) id += "-2";

/* ---------------- fotos: compressão no aparelho ---------------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Não deu pra abrir essa imagem")); };
    img.src = url;
  });
}
function toJpeg(img, max, q) {
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", q);
}
async function processPhoto(file) {
  const img = await loadImage(file);
  let full = toJpeg(img, 1280, 0.72);
  if (full.length > 700000) full = toJpeg(img, 1000, 0.62);   // Firestore aceita até ~1 MB por documento
  return full;
}
async function thumbFrom(dataUrl) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const s = 160, c = document.createElement("canvas"); c.width = s; c.height = s;
  const k = Math.max(s / img.naturalWidth, s / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k;
  c.getContext("2d").drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
  return c.toDataURL("image/jpeg", 0.7);
}

  let casaId = null;
  const casa = () => (db.casas[casaId] = db.casas[casaId] || { items: {}, settings: {}, photos: {} });

    try { localStorage.setItem(KEY, JSON.stringify(db)); }

    listeners.forEach(fn => fn());
  };

    onAuth(cb) { authCb = cb; setTimeout(() => cb(userOf(db.session)), 120); },

      const u = db.users[email];
      if (!u || (u.senha && u.senha !== senha)) throw { code: "auth/invalid-credential" };
      db.session = email; persist(); authCb(userOf(email));
    },
    async createAccount(email, senha) {
      email = (email || "").toLowerCase();
      if (db.users[email]) throw { code: "auth/email-already-in-use" };
      db.users[email] = { uid: "demo-" + Date.now().toString(36), senha };
      db.session = email; persist(); authCb(userOf(email));
    },
    async logout() { delete db.session; persist(); authCb(null); },
    async reset() {},
    subscribe(id, onItems, onSettings) {
      casaId = id;
      const fn = () => { if (casaId !== id) return; onItems(Object.values(casa().items)); onSettings(casa().settings); };
      listeners.add(fn); setTimeout(fn, 60);
      return () => listeners.delete(fn);
    },
    async putItem(it) { const c = casa(); c.items[it.id] = { ...(c.items[it.id] || {}), ...it }; persist(); },
    async delItem(id) { delete casa().items[id]; persist(); },
    async putSettings(o) { const c = casa(); c.settings = { ...c.settings, ...o }; persist(); },
    async seed(list) { const c = casa(); list.forEach(it => c.items[it.id] = it); c.settings.importado = true; persist(); },
    async getPhotos(id) { return casa().photos[id] || []; },
    async putPhotos(id, arr) { const c = casa(); if (arr.length) c.photos[id] = arr; else delete c.photos[id]; persist(); }
  };
}

async function makeFirebaseStore() {
  const V = "10.12.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")
  ]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  try { await A.setPersistence(auth, A.browserLocalPersistence); } catch {}
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch { db = F.getFirestore(app); }
  let casa, col, foto;
  const useCasa = id => {
    casa = F.doc(db, "casas", id);
    col = F.collection(db, "casas", id, "itens");
    foto = (item, i) => F.doc(db, "casas", id, "fotos", `${item}__${i}`);
  };
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? { email: u.email, uid: u.uid } : null)),
    login: (e, s) => A.signInWithEmailAndPassword(auth, e, s),
    createAccount: (e, s) => A.createUserWithEmailAndPassword(auth, e, s),
    logout: () => A.signOut(auth),
    reset: e => A.sendPasswordResetEmail(auth, e),
    subscribe(id, onItems, onSettings, onErr) {
      useCasa(id);
      const u1 = F.onSnapshot(col, s => { const arr = []; s.forEach(d => arr.push({ id: d.id, ...d.data() })); onItems(arr, s.metadata.fromCache); }, onErr);
      const u2 = F.onSnapshot(casa, d => onSettings(d.exists() ? d.data() : {}), onErr);
      return () => { u1(); u2(); };
    },
    putItem(it) { const { id, ...rest } = it; return F.setDoc(F.doc(col, id), rest, { merge: true }); },
    delItem: id => F.deleteDoc(F.doc(col, id)),
    putSettings: o => F.setDoc(casa, o, { merge: true }),
    async seed(list) {
      for (let i = 0; i < list.length; i += 400) {
        const b = F.writeBatch(db);
        list.slice(i, i + 400).forEach(({ id, ...r }) => b.set(F.doc(col, id), r));
        await b.commit();
      }
      await F.setDoc(casa, { importado: true }, { merge: true });
    },
    async getPhotos(id) {
      const snaps = await Promise.all([0, 1, 2].map(i => F.getDoc(foto(id, i)).catch(() => null)));
      return snaps.filter(s => s && s.exists()).map(s => s.data().data);
    },
    async putPhotos(id, arr) {
      await Promise.all([0, 1, 2].map(i => arr[i] ? F.setDoc(foto(id, i), { data: arr[i], itemId: id }) : F.deleteDoc(foto(id, i)).catch(() => {})));
    }
  };
}

function parseRoute() {

  const [a, b] = h.split("/");
  if (a === "c" && b) return { name: "room", id: b, depth: 1, key: "c/" + b };
  if (a === "i" && b) return { name: "item", id: b, depth: 2, key: "i/" + b };
  if (a === "ordem") return { name: "ordem", depth: 0, tab: true, key: "ordem" };
  if (a === "gastos") return { name: "gastos", depth: 0, tab: true, key: "gastos" };
  if (a === "busca") return { name: "busca", depth: 0, tab: true, key: "busca" };
  return { name: "home", depth: 0, tab: true, key: "home" };
}

function render(mode) {
  const app = $("#app");
  if (S.user === undefined) return;
  if (!S.user) { app.innerHTML = viewLogin(); setTabs(null); return; }
  const r = S.route || parseRoute();
  let html = "";
  const onb = S.loaded && needsOnboarding();
  if (!S.loaded) html = `<div class="loading"><div class="spinner" role="status" aria-label="Carregando"></div></div>`;
  else if (onb) html = viewOnboarding();
  else if (r.name === "room") html = viewRoom(r.id);
  else if (r.name === "item") html = viewItem(r.id);
  else if (r.name === "ordem") html = viewOrdem();
  else if (r.name === "gastos") html = viewGastos();
  else if (r.name === "busca") html = viewBusca();
  else html = viewHome();
  app.innerHTML = html;
  const page = app.firstElementChild;
  if (mode && page) page.classList.add(mode);
  setTabs(r.tab && !onb && S.loaded ? r.name : null);
  if (r.name === "ordem" && S.loaded && !onb && S.settings.onboarded && !S.settings.viuOrdem) { S.settings.viuOrdem = true; write(S.store.putSettings({ viuOrdem: true })); }
  // barras e anéis animam só na primeira abertura do app e ao entrar num cômodo
  let animate = false;
  if (S.loaded && page && !page.classList.contains("loading")) {
    animate = !S.introDone || (r.name === "room" && mode === "enter-push");
    S.introDone = true;
  }
  afterRender(r, animate);
}

function afterRender(r, animate) {
  const fill = () => {
    document.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w + "%");
    document.querySelectorAll("[data-h]").forEach(el => el.style.height = el.dataset.h + "px");
    document.querySelectorAll("[data-off]").forEach(el => el.style.strokeDashoffset = el.dataset.off);
  };
  if (animate) {
    // começa do zero e cresce até o valor
    requestAnimationFrame(() => requestAnimationFrame(fill));
  } else {
    // já aparece no valor final, sem animação
    const els = document.querySelectorAll("[data-w],[data-h],[data-off]");
    document.querySelectorAll(".stagger").forEach(el => el.classList.remove("stagger"));
    els.forEach(el => el.style.transition = "none");
    fill();
    void document.body.offsetHeight;
    requestAnimationFrame(() => els.forEach(el => el.style.transition = ""));
  }
  if (S.popId) {
    const row = document.querySelector(`.item[data-id="${CSS.escape(S.popId)}"]`);
    if (row) row.classList.add("pop");
    S.popId = null;
  }
  if (r.name === "item") loadPhotos(r.id);
}

function navigate() {
  const prev = S.route;
  if (prev) S.scroll[prev.key] = window.scrollY;
  const r = parseRoute();
  S.route = r;
  let mode = "enter-fade";
  if (prev) {
    if (r.depth > prev.depth) mode = "enter-push";
    else if (r.depth < prev.depth) mode = "enter-pop";
  }
  render(mode);
  const y = (prev && r.depth < prev.depth) ? (S.scroll[r.key] || 0) : 0;
  window.scrollTo(0, y);
}

function refresh() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    if (document.querySelector(".overlay")) { S.dirty = true; return; }
    const y = window.scrollY;
    render(null);
    window.scrollTo(0, y);
  });
}

function setTabs(active) {

  const t = (id, href, icon, label) => `<a class="tab" href="${href}" ${active === id ? 'aria-current="page"' : ""}>${ic(icon, 24, 1.9)}${label}</a>`;

}

const CATALOGO = ["cozinha", "sala-estar", "sala-jantar", "quarto", "banheiro", "lavanderia", "escritorio", "hall", "varanda", "gourmet", "closet"];
const needsOnboarding = () => !S.settings.onboarded && !S.settings.importado && S.items.size === 0;
function obState() {
  if (!S.ob) S.ob = { step: 2, casal: false, n1: "", n2: "", casa: "", sel: { "cozinha": 1, "sala-estar": 1, "quarto": 1, "banheiro": 1, "lavanderia": 1 }, cnt: { quarto: 1, banheiro: 1 }, custom: [], mode: "sug", off: {}, entrega: "", semData: false };
  return S.ob;
}
function obRooms() {
  const o = obState(), out = [];
  for (const t of CATALOGO) {
    if (!o.sel[t]) continue;
    const n = TIPOS[t].contador ? (o.cnt[t] || 1) : 1;
    if (n > 1) for (let i = 1; i <= n; i++) out.push({ id: `${t}-${i}`, nome: `${TIPOS[t].nome} ${i}`, tipo: t });
    else out.push({ id: t, nome: TIPOS[t].nome, tipo: t });
  }
  o.custom.forEach(nome => { let id = "c-" + slug(nome); while (out.some(r => r.id === id)) id += "-2"; out.push({ id, nome, tipo: "outro" }); });
  return out;
}

function obNomes() { const o = obState(); const a = o.n1.trim(), b = o.n2.trim(); return o.casal ? [a, b].filter(Boolean).join(" e ") : a; }
async function finishOnboarding(btn) {
  const o = obState();
  if (!o.semData && $("#obEntrega")) o.entrega = $("#obEntrega").value;
  const rooms = obRooms();
  const comodos = [...rooms, ...CASA_TODA].map(({ id, nome, tipo }) => ({ id, nome, tipo }));
  const settings = {
    onboarded: true, importado: true, criadoEm: Date.now(), casal: o.casal,
    nomes: obNomes(), nomeCasa: o.casa.trim() || (o.casal ? "Nossa casa" : "Minha casa"),
    entrega: o.semData ? null : (o.entrega || null), comodos, comecouDoZero: o.mode !== "sug"
  };
  const items = o.mode === "sug" ? buildSeedFor(comodos.filter(r => !o.off[r.id])) : [];
  btn.disabled = true; btn.textContent = "Criando…";
  S.settings = { ...S.settings, ...settings };
  applyRooms();
  items.forEach(i => S.items.set(i.id, i));
  try {
    await S.store.putSettings(settings);
    if (items.length) S.store.seed(items).catch(err => { console.error(err); toast("A lista não terminou de salvar. Confira a internet."); });
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = "Tentar de novo";
    toast(err?.code === "permission-denied" ? "Sem permissão — confira as regras do Firestore" : "Não deu pra criar. Confira a internet.");
    return;
  }
  S.ob = null; S.introDone = false;
  if (location.hash && location.hash !== "#/") go("#/"); else render("enter-fade");
  toast(`${settings.nomeCasa} criada!`);
}

function roomStats(id) { const l = inRoom(id); return { d: done(l), t: l.length }; }

function nextStage() {
  for (const n of [1, 2, 3]) {
    const l = all().filter(i => i.etapa === n);
    const falta = l.filter(i => !i.comprado);
    if (falta.length) return { n, l, falta };
  }
  return null;
}

function viewRoom(id) {
  const r = ROOM[id];
  if (!r) return `<main class="page no-tabs"><div class="topbar"><button class="icon-btn" data-act="back" aria-label="Voltar">${ic("back", 22, 2)}</button></div><div class="empty-state"><b>Cômodo não encontrado</b><span>Ele pode ter sido removido em Ajustes.</span></div></main>`;
  const list = inRoom(id);
  // sugestões: itens da lista base deste tipo de cômodo que ainda não estão aqui
  const nomesAqui = new Set(list.map(i => slug(i.nome)));
  const sugs = list.length < 6 ? seedRowsFor(r.tipo).flatMap(([, tp, l]) => l.map(raw => ({ tp, ...parseSeedName(raw) }))).filter(x => !nomesAqui.has(slug(x.nome))).slice(0, 14) : [];
  const d = done(list), t = list.length;
  const topics = topicsOf(id);
  const sel = topics.length > 1 ? (S.roomTopic[id] ?? topics[0]) : "*";
  const filt = S.roomFilter[id] || "all";
  const pass = i => filt === "all" || (filt === "falta" ? !i.comprado : i.comprado);

  const semValor = comprados.length - pagos.length;

  pagos.filter(i => i.data).forEach(i => { const k = i.data.slice(0, 7); (byMonth[k] = byMonth[k] || []).push(i); });

      <div class="split"><span>${plural(pagos.length, "compra com valor", "compras com valor")}</span><span>${pagos.length ? `média <b>${money(Math.round(total / pagos.length))}</b>` : ""}</span></div>

/* ---------------- folhas (sheets) ---------------- */
function openSheet(title, bodyHtml, { saveLabel, onSave, onMount, onClose } = {}) {
  document.querySelector(".toast")?.remove();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><span class="grab" aria-hidden="true"></span>
      <div class="sheet-bar"><button data-x>Cancelar</button><h2>${esc(title)}</h2>${saveLabel ? `<button class="save" data-s>${saveLabel}</button>` : `<span style="width:64px"></span>`}</div>
    </div>
    <div class="sheet-body">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  const sheet = $(".sheet", ov);
  const close = () => {
    if (ov.classList.contains("closing")) return;
    ov.classList.add("closing");
    setTimeout(() => {
      ov.remove(); document.body.style.overflow = "";
      onClose && onClose();
      if (S.dirty) { S.dirty = false; refresh(); }
    }, 280);
  };
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  $("[data-x]", ov).onclick = close;
  if (onSave) $("[data-s]", ov).onclick = async () => { const b = $("[data-s]", ov); b.disabled = true; try { if (await onSave(ov) !== false) close(); } finally { b.disabled = false; } };
  // arrastar para fechar
  let y0 = null, dy = 0;
  const head = $(".sheet-head", ov);
  head.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; sheet.style.transition = "none"; }, { passive: true });
  head.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
  head.addEventListener("touchend", () => { sheet.style.transition = "transform .3s var(--ease)"; if (dy > 110) close(); else sheet.style.transform = ""; y0 = null; dy = 0; });
  onMount && onMount(ov, close);
  return close;
}

/* fotos dentro de uma folha: desenha as miniaturas, adiciona e remove (até 3) */
function setupPhotos(ov, photos, onChange) {
  const box = $("#fPhotos", ov);
  const draw = () => {
    box.innerHTML = photos.map((p, i) => `<div class="ph"><img src="${p}" alt="Foto ${i + 1}"><button type="button" class="rm" data-rm="${i}" aria-label="Remover foto ${i + 1}">${ic("x", 14, 2.6)}</button></div>`).join("")
      + (photos.length < 3 ? `<button type="button" class="ph-add" id="phAdd">${ic("camera", 24, 1.8)}Adicionar</button>` : "");
  };
  draw();
  box.onclick = e => {
    const rm = e.target.closest("[data-rm]");
    if (rm) { photos.splice(+rm.dataset.rm, 1); onChange(); draw(); return; }
    if (e.target.closest("#phAdd")) {
      const fp = $("#filepick");
      fp.value = "";
      fp.onchange = async () => {
        const f = fp.files[0]; if (!f) return;
        const add = $("#phAdd", ov); if (add) add.innerHTML = `<div class="spinner"></div>`;
        try { photos.push(await processPhoto(f)); onChange(); }
        catch (err) { toast(err.message || "Não deu pra usar essa foto"); }
        draw();
      };
      fp.click();
    }
  };
}

      <div class="field"><label for="pData">Data</label><input class="input" id="pData" type="date" value="${esc(it.data || today())}"></div>

      <div class="field"><label for="pParc">Pagamento</label><input class="input" id="pParc" placeholder="Ex.: 10× R$ 99" value="${esc(it.parcelas || "")}"></div>
    </div>
    <div class="field"><label for="pGar">Garantia até</label><input class="input" id="pGar" placeholder="Ex.: ago 2027 (opcional)" value="${esc(it.garantia || "")}"></div>
    <div class="field"><span class="lbl">Foto (opcional)</span><div class="photo-row" id="fPhotos"></div></div>
    <button class="btn primary block" type="button" data-confirm>${ic("check", 20, 2.6)} Marcar como comprado</button>
    <button class="link-btn" type="button" data-skip>Marcar sem preencher agora</button>`, {
    saveLabel: "Salvar",
    onMount(ov) {
      setupPhotos(ov, photos, () => { photosChanged = true; });
      $("[data-confirm]", ov).onclick = () => $("[data-s]", ov).click();
      $("[data-skip]", ov).onclick = () => { skip = true; $("[data-s]", ov).click(); };
      setTimeout(() => { if (!skip) $("#pPago", ov)?.focus(); }, 450);
    },
    async onSave(ov) {
      const patch = { id, comprado: true, atualizadoEm: Date.now(), data: $("#pData", ov).value || today() };
      if (!skip) {
        patch.valorPago = parseMoney($("#pPago", ov).value);
        patch.loja = $("#pLoja", ov).value.trim() || null;
        patch.parcelas = $("#pParc", ov).value.trim() || null;
        patch.garantia = $("#pGar", ov).value.trim() || null;
      }
      if (photosChanged) {
        patch.thumb = photos[0] ? await thumbFrom(photos[0]) : null;

      }
      S.items.set(id, { ...it, ...patch });
      write(S.store.putItem(patch));
      if (photosChanged) write(S.store.putPhotos(id, photos), "As fotos não foram salvas. Tente de novo.");
      S.popId = id;
      S.dirty = true;
      toast(`${it.nome} comprado${patch.valorPago ? " · " + money(patch.valorPago) : ""}`);
      return true;
    }
  });
}

async function openItemForm(id, defaults = {}) {
  const it = id ? S.items.get(id) : null;
  let photos = id ? (S.photos[id] ?? await S.store.getPhotos(id).catch(() => [])) : [];
  photos = [...photos];
  let photosChanged = false;
  const state = { etapa: it?.etapa || 0, comprado: !!it?.comprado };
  openSheet(it ? "Editar item" : "Novo item", itemForm(it, defaults), {
    saveLabel: "Salvar",
    onMount(ov) {
      const roomSel = $("#fRoom", ov), topicSel = $("#fTopic", ov), newWrap = $("#fNewTopicWrap", ov);
      const fillTopics = (keep) => {
        const ts = topicsOf(roomSel.value);
        const cur = keep ?? (ts[0] || "");
        const opts = ts.length ? ts : [""];
        topicSel.innerHTML = opts.map(t => `<option value="${esc(t)}" ${t === cur ? "selected" : ""}>${esc(t || "Sem tópico")}</option>`).join("") + `<option value="__new">+ Novo tópico…</option>`;
        if (cur && !opts.includes(cur)) { topicSel.insertAdjacentHTML("afterbegin", `<option value="${esc(cur)}" selected>${esc(cur)}</option>`); }
        newWrap.classList.toggle("hidden", topicSel.value !== "__new");
      };
      fillTopics(it ? (it.topico || "") : (defaults.topic ?? undefined));
      roomSel.onchange = () => fillTopics();
      topicSel.onchange = () => { newWrap.classList.toggle("hidden", topicSel.value !== "__new"); if (topicSel.value === "__new") $("#fNewTopic", ov).focus(); };
      $("#fStage", ov).onclick = e => { const b = e.target.closest("button"); if (!b) return; state.etapa = +b.dataset.v; [...$("#fStage", ov).children].forEach(x => x.setAttribute("aria-pressed", x === b)); };
      $("#fStatus", ov).onclick = e => { const b = e.target.closest("button"); if (!b) return; state.comprado = b.dataset.v === "1"; [...$("#fStatus", ov).children].forEach(x => x.setAttribute("aria-pressed", x === b)); $("#fOk", ov).classList.toggle("hidden", !state.comprado); if (state.comprado && !$("#fData", ov).value) $("#fData", ov).value = today(); };
      setupPhotos(ov, photos, () => { photosChanged = true; });
      if (defaults.photo) setTimeout(() => $("#phAdd", ov)?.click(), 350);
      if (!it && !defaults.nome) setTimeout(() => $("#fNome", ov).focus(), 450);
    },
    async onSave(ov) {
      const nome = $("#fNome", ov).value.trim();
      if (!nome) { $("#fErr", ov).textContent = "Dê um nome para o item."; $("#fNome", ov).focus(); return false; }
      let topico = $("#fTopic", ov).value;
      if (topico === "__new") { topico = $("#fNewTopic", ov).value.trim(); if (!topico) { $("#fErr", ov).textContent = "Escreva o nome do novo tópico."; return false; } }
      const comodo = $("#fRoom", ov).value;
      const data = {
        id: it ? it.id : `${comodo}--${slug(topico || "geral")}--${slug(nome)}-${Date.now().toString(36)}`,
        nome, comodo, topico, etapa: state.etapa, comprado: state.comprado,
        valorPrevisto: parseMoney($("#fPrev", ov).value),
        valorPago: state.comprado ? parseMoney($("#fPago", ov).value) : (it?.valorPago ?? null),
        data: state.comprado ? ($("#fData", ov).value || null) : (it?.data ?? null),
        parcelas: $("#fParc", ov).value.trim() || null,
        garantia: $("#fGar", ov).value.trim() || null,
        loja: $("#fLoja", ov).value.trim() || null,
        link: (() => { let l = $("#fLink", ov).value.trim(); if (l && !/^https?:\/\//i.test(l)) l = "https://" + l; return l || null; })(),
        notas: $("#fNotas", ov).value.trim() || null,
        ordem: it ? it.ordem : Date.now(),
        atualizadoEm: Date.now()
      };
      if (!it) data.criadoEm = Date.now();
      if (photosChanged) {
        data.thumb = photos[0] ? await thumbFrom(photos[0]) : null;
        S.photos[data.id] = photos;
      }
      S.items.set(data.id, { ...(it || {}), ...data });
      write(S.store.putItem(data));
      if (photosChanged) write(S.store.putPhotos(data.id, photos), "As fotos não foram salvas. Tente de novo.");
      toast(it ? "Item atualizado" : `Adicionado em ${ROOM[comodo].nome}`);
      S.dirty = true;
      return true;
    }
  });
}

function openSettings() {
  const legacy = S.casaId === "nosso-ap";

  const nomes = S.settings.nomes ?? (legacy ? NOMES_PADRAO : "");

  openSheet("Ajustes", `
    <div class="field"><label for="sCasa">Nome da casa</label><input class="input" id="sCasa" value="${esc(S.settings.nomeCasa || CASA_PADRAO)}"></div>
    <div class="field"><label for="sNomes">Nomes na saudação</label><input class="input" id="sNomes" value="${esc(nomes)}" placeholder="Ex.: Ana e Pedro"></div>

    <button class="btn ghost block" data-rooms type="button">${ic("home", 18, 2)} Cômodos da casa (${ROOMS.length})</button>
    <button class="btn ghost block" data-trash type="button">${ic("trash", 18, 2)} Itens excluídos${nExcl ? ` (${nExcl})` : ""}</button>
    <button class="btn ghost block" data-exp type="button">Baixar backup da lista (JSON)</button>

      <span style="font-size:13px;color:var(--muted)">Conectado como <b style="color:var(--ink)">${esc(S.user?.email || "")}</b>${DEMO ? " · modo demonstração" : ""}</span>
      <button class="btn ghost block" data-out type="button">Sair</button>
    </div>
    <p style="margin:0;text-align:center;font-size:12px;color:var(--faint)">Cozily · sua casa, item por item</p>`, {

    onMount(ov, close) {
      $("[data-out]", ov).onclick = async () => { close(); await S.store.logout(); };

        const blob = new Blob([JSON.stringify({ exportadoEm: new Date().toISOString(), itens: all().map(({ thumb, ...r }) => r) }, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `cozily-backup-${today()}.json`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);

      S.settings = { ...S.settings, ...o };

      S.dirty = true;
      return true;

}

/* editar cômodos: renomear, adicionar e remover (só vazios) */
function openRoomsEditor() {
  let list = ROOMS.map(({ id, nome, tipo }) => ({ id, nome, tipo: tipo || id }));
  const draw = () => list.map((r, i) => {
    const n = inRoom(r.id).length;
    const T = TIPOS[r.tipo] || TIPOS.outro;
    return `<div class="list-link ${T.cor}" style="padding:10px 12px">
      <span class="tile">${ic(T.icon)}</span>
      <label class="sr" for="rn${i}">Nome do cômodo</label>
      <input class="input" id="rn${i}" data-i="${i}" value="${esc(r.nome)}" style="flex:1;min-width:0;height:44px">
      ${n ? `<span class="count" style="min-width:56px;text-align:right">${plural(n, "item", "itens")}</span>`
        : `<button type="button" data-rm="${i}" aria-label="Remover ${esc(r.nome)}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--danger)">${ic("trash", 18, 2)}</button>`}
    </div>`;
  }).join("");
  openSheet("Cômodos", `
    <p style="margin:0;font-size:14px;color:var(--muted)">Toque no nome para renomear. Só dá para remover cômodos sem itens.</p>
    <div class="list" id="rList">${draw()}</div>
    <div class="field"><span class="lbl">Adicionar cômodo</span>
      <div class="row-gap"><label class="sr" for="rTipo">Tipo</label><select class="input" id="rTipo" style="flex:1;min-width:0">${[...CATALOGO, "outro"].map(t => `<option value="${t}">${TIPOS[t].nome}</option>`).join("")}</select>
      <button type="button" class="btn" id="rAdd" style="background:var(--accent-soft);color:var(--accent-text);min-height:50px">Adicionar</button></div>
      <label class="sr" for="rNome">Nome</label><input class="input" id="rNome" placeholder="Nome (opcional, ex.: Quarto do bebê)">
    </div>`, {
    saveLabel: "Salvar",
    onMount(ov) {
      const box = $("#rList", ov);
      box.oninput = e => { const i = e.target.dataset.i; if (i !== undefined) list[+i].nome = e.target.value; };
      box.onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { list.splice(+b.dataset.rm, 1); box.innerHTML = draw(); } };
      $("#rAdd", ov).onclick = () => {
        const tipo = $("#rTipo", ov).value, T = TIPOS[tipo];
        let nome = $("#rNome", ov).value.trim();
        if (!nome) { const same = list.filter(r => r.tipo === tipo).length; nome = same ? `${T.nome} ${same + 1}` : T.nome; }
        const base = tipo === "outro" ? "c-" + slug(nome) : tipo;
        let id = base, k = 2;
        while (list.some(r => r.id === id)) id = base + "-" + k++;
        const ct = list.findIndex(r => (TIPOS[r.tipo] || {}).casaToda);
        list.splice(ct < 0 ? list.length : ct, 0, { id, nome, tipo });
        $("#rNome", ov).value = "";
        box.innerHTML = draw();
      };
    },
    async onSave() {
      list = list.map(r => ({ ...r, nome: r.nome.trim() || (TIPOS[r.tipo] || TIPOS.outro).nome }));
      S.settings = { ...S.settings, comodos: list };
      applyRooms();
      write(S.store.putSettings({ comodos: list }));
      S.dirty = true;
      toast("Cômodos atualizados");
      return true;
    }
  });
}

/* ---------------- ações ---------------- */
function write(p, msg = "Não foi possível salvar. Confira a internet.") {
  Promise.resolve(p).catch(err => { console.error(err); toast(err?.code === "permission-denied" ? "Sem permissão — confira as regras do Firestore" : msg); });
}

function toggleItem(id) {
  const it = S.items.get(id); if (!it) return;
  if (!it.comprado) { openPurchaseSheet(id); return; }
  // desmarcar continua direto
  const patch = { id, comprado: false, atualizadoEm: Date.now() };
  S.items.set(id, { ...it, ...patch });
  write(S.store.putItem(patch));
  S.popId = id;
  const y = window.scrollY;
  render(null); window.scrollTo(0, y);
  toast(`${it.nome} voltou para “falta”`, "Desfazer", () => { S.items.set(id, it); write(S.store.putItem({ id, comprado: true, atualizadoEm: Date.now() })); S.popId = id; refresh(); });
}

function deleteItem(id) {
  const it = S.items.get(id); if (!it) return;
  openSheet("Excluir item", `<p style="margin:0;font-size:16px">Excluir <b>${esc(it.nome)}</b> da lista? Ele vai para a lixeira e dá pra restaurar em Ajustes › Itens excluídos.</p>
    <button class="btn primary block" data-yes type="button" style="background:var(--danger);color:var(--card)">Excluir</button>`, {
    onMount(ov, close) { $("[data-yes]", ov).onclick = () => { close(); reallyDelete(id, it); }; }
  });
}

/* excluir manda para a lixeira (dá pra restaurar em Ajustes › Itens excluídos) */
function reallyDelete(id, it) {
  const patch = { id, excluido: true, excluidoEm: Date.now() };
  S.items.set(id, { ...it, ...patch });
  write(S.store.putItem(patch));
  if (S.route?.name === "item") back("#/c/" + it.comodo); else refresh();
  toast(`${it.nome} foi para a lixeira`, "Desfazer", () => restoreItem(id), 10000);
}

function restoreItem(id) {
  const it = S.items.get(id);
  if (it) {
    S.items.set(id, { ...it, excluido: false, excluidoEm: null });
    write(S.store.putItem({ id, excluido: false, excluidoEm: null, atualizadoEm: Date.now() }));
  } else {
    const seed = buildSeed().find(i => i.id === id);
    if (!seed) return;
    S.items.set(id, seed);
    write(S.store.putItem(seed));
  }
  S.popId = id;
  const n = S.items.get(id);
  toast(`${n.nome} voltou para ${ROOM[n.comodo]?.nome || "a lista"}`);
  refresh();
}

function purgeItem(id) {
  S.items.delete(id);
  delete S.photos[id];
  write(S.store.delItem(id));
  write(S.store.putPhotos(id, []));
}

function openTrash() {
  const row = (it, kind) => { const r = ROOM[it.comodo] || ROOMS[0]; return `<div class="item ${r.cor}" data-tid="${esc(it.id)}">
    <div class="item-main" style="cursor:default"><span class="item-txt"><span class="item-name">${esc(it.nome)}</span>
    <span class="meta"><span class="dot"></span><span class="room">${esc(r.nome)}</span>${kind === "lixo" && it.excluidoEm ? `<span>· ${new Date(it.excluidoEm).getDate()} ${MESES[new Date(it.excluidoEm).getMonth()]}</span>` : kind === "seed" ? "<span>· da lista original</span>" : ""}</span></span></div>
    <button class="btn ghost" style="min-height:40px;padding:0 14px;font-size:14px" data-restore="${esc(it.id)}">Restaurar</button>
    ${kind === "lixo" ? `<button data-purge="${esc(it.id)}" aria-label="Apagar ${esc(it.nome)} de vez" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--danger)">${ic("trash", 18, 2)}</button>` : ""}
  </div>`; };
  const draw = () => {
    const l = lixeira(), sm = sumidos();
    return (l.length ? `<div class="group-h"><h3>Lixeira</h3><span>${l.length}</span></div><div class="items">${l.map(i => row(i, "lixo")).join("")}</div>` : "")
      + (sm.length ? `<div class="group-h"><h3>Apagados da lista original</h3><span>${sm.length}</span></div><div class="items">${sm.map(i => row(i, "seed")).join("")}</div>` : "")
      + (!l.length && !sm.length ? `<div class="empty-state"><b>Nada excluído</b><span>Itens que vocês excluírem aparecem aqui e podem ser restaurados.</span></div>` : "");
  };
  openSheet("Itens excluídos", `<div id="trashBox" style="display:flex;flex-direction:column;gap:10px">${draw()}</div>`, {
    onMount(ov) {
      const box = $("#trashBox", ov);
      box.onclick = e => {
        const r = e.target.closest("[data-restore]");
        if (r) { restoreItem(r.dataset.restore); S.dirty = true; box.innerHTML = draw(); return; }
        const pz = e.target.closest("[data-purge]");
        if (pz) {
          if (pz.dataset.sure) { purgeItem(pz.dataset.purge); S.dirty = true; box.innerHTML = draw(); toast("Apagado de vez"); }
          else { pz.dataset.sure = "1"; pz.innerHTML = `<span style="font-size:12px;font-weight:700">Apagar?</span>`; }
        }
      };
    }
  });
}

async function loadPhotos(id) {
  if (S.photos[id] !== undefined || S.pending.has(id)) return;
  const it = S.items.get(id);
  if (!it || !it.thumb) { S.photos[id] = []; return; }
  S.pending.add(id);
  try { S.photos[id] = await S.store.getPhotos(id); } catch { S.photos[id] = [it.thumb]; }
  S.pending.delete(id);
  if (S.route?.name === "item" && S.route.id === id) refresh();
}

let toastTimer;
function toast(msg, actionLabel, action, ms = 3200) {
  document.querySelector(".toast")?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button>${esc(actionLabel)}</button><i style="animation-duration:${ms}ms"></i>` : ""}`;
  if (actionLabel) $("button", t).onclick = () => { t.remove(); action(); };
  document.body.appendChild(t);
  toastTimer = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, ms);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "toggle") { e.preventDefault(); toggleItem(id); }
  else if (a === "back") back(S.route?.name === "item" ? "#/c/" + (S.items.get(S.route.id)?.comodo || "") : "#/");
  else if (a === "add") openItemForm(null, { room: el.dataset.room, topic: el.dataset.topic, nome: el.dataset.name });
  else if (a === "edit") openItemForm(id, { photo: !!el.dataset.photo });
  else if (a === "delete") deleteItem(id);
  else if (a === "restore") restoreItem(id);
  else if (a === "settings") openSettings();
  else if (a === "filter") { S.roomFilter[el.dataset.room] = el.dataset.v; refresh(); }
  else if (a === "topic") { S.roomTopic[el.dataset.room] = el.dataset.v; const y = window.scrollY; render(null); window.scrollTo(0, y); el.scrollIntoView?.({ inline: "center", block: "nearest", behavior: "smooth" }); }
  else if (a === "stage") { S.stage = +el.dataset.v; refresh(); }
  else if (a === "month") { S.month = el.dataset.v; refresh(); }
  else if (a === "qfilter") { S.qFilter = el.dataset.v; refresh(); }
  else if (a === "authmode") { S.authEmail = $("#lEmail")?.value || S.authEmail; S.authMode = el.dataset.v; render(null); }
  else if (a === "passos-ok") { S.settings.passosOk = true; write(S.store.putSettings({ passosOk: true })); refresh(); }
  else if (a === "add-sug") {
    const it = { id: `${el.dataset.room}--${slug(el.dataset.topic || "geral")}--${slug(el.dataset.name)}-${Date.now().toString(36)}`, nome: el.dataset.name, comodo: el.dataset.room, topico: el.dataset.topic || "", etapa: +el.dataset.etapa || 0, comprado: false, ordem: Date.now(), criadoEm: Date.now() };
    S.items.set(it.id, it); write(S.store.putItem(it)); S.popId = it.id;
    const y = window.scrollY; render(null); window.scrollTo(0, y);
  }
  else if (a.startsWith("ob-")) obAction(a, el);
  else if (a === "reset") {
    const email = $("#lEmail")?.value.trim();
    if (!email) { $("#lErr").textContent = "Escreva seu e-mail acima e toque de novo."; return; }
    S.store.reset(email).then(() => toast("Enviamos um link para redefinir a senha")).catch(() => toast("Não deu pra enviar. Confira o e-mail."));
  }
});

document.addEventListener("click", e => {
  const n = e.target.closest(".next[data-stage]");
  if (n) S.stage = +n.dataset.stage;
}, true);

document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "lEmail") S.authEmail = e.target.value;
  if (S.ob && (id === "obN1" || id === "obN2" || id === "obCasa")) {
    const o = S.ob;
    if (id === "obN1") o.n1 = e.target.value; else if (id === "obN2") o.n2 = e.target.value; else o.casa = e.target.value;
    const pn = $("#obPrevNomes"), pc = $("#obPrevCasa");
    if (pn) pn.textContent = "Boa noite" + (obNomes() ? ", " + obNomes() : "");
    if (pc) pc.textContent = o.casa.trim() || (o.casal ? "Nossa casa" : "Minha casa");
  }
  if (S.ob && id === "obEntrega") S.ob.entrega = e.target.value;
  if (e.target.id === "q") {
    S.q = e.target.value;
    const box = $("#qres"); if (!box) return;
    const tmp = document.createElement("div"); tmp.innerHTML = viewBusca();
    box.innerHTML = $("#qres", tmp).innerHTML;
  }
});

document.addEventListener("submit", async e => {
  if (e.target.id === "obCustomForm") {
    e.preventDefault();
    const inp = $("#obCustom"), nome = inp.value.trim();
    if (!nome) return;
    const o = obState();
    if (!o.custom.some(c => c.toLowerCase() === nome.toLowerCase())) o.custom.push(nome);
    render(null);
    return;
  }
  if (e.target.id !== "loginForm") return;
  e.preventDefault();
  const criar = S.authMode === "criar";
  const email = $("#lEmail").value.trim(), senha = $("#lSenha").value;
  const err = $("#lErr"), btn = $("#lBtn");
  err.textContent = "";
  if (!email || !senha) { err.textContent = "Preencha e-mail e senha."; return; }
  if (criar) {
    if (senha.length < 6) { err.textContent = "A senha precisa ter pelo menos 6 caracteres."; return; }
    if (senha !== $("#lSenha2").value) { err.textContent = "As duas senhas estão diferentes."; return; }
  }
  btn.disabled = true; btn.textContent = criar ? "Criando conta…" : "Entrando…";
  try {
    S.ob = null;
    if (criar) await S.store.createAccount(email, senha);
    else await S.store.login(email, senha);
  }
  catch (x) {
    const c = x?.code || "";
    err.textContent = c.includes("email-already-in-use") ? "Já existe uma conta com esse e-mail. Toque em Entrar."
      : c.includes("invalid-email") ? "Esse e-mail não parece certo."
      : c.includes("weak-password") ? "Escolha uma senha mais forte (6 caracteres ou mais)."
      : c.includes("operation-not-allowed") || c.includes("admin-restricted") ? "A criação de contas está desligada no Firebase."
      : c.includes("invalid") || c.includes("wrong-password") || c.includes("user-not-found") ? "E-mail ou senha incorretos."
      : c.includes("too-many") ? "Muitas tentativas. Espere um pouco e tente de novo."
      : c.includes("network") ? "Sem internet no momento." : (criar ? "Não deu pra criar a conta. Tente de novo." : "Não deu pra entrar. Tente de novo.");
    btn.disabled = false; btn.textContent = criar ? "Criar conta" : "Entrar";
  }
});

function obAction(a, el) {
  const o = obState();
  const rerender = () => { const y = window.scrollY; render(null); window.scrollTo(0, y); };
  if (a === "ob-casal") { o.casal = !o.casal; rerender(); }
  else if (a === "ob-room") { const t = el.dataset.v; o.sel[t] = !o.sel[t]; rerender(); }
  else if (a === "ob-cnt") { const t = el.dataset.v; o.cnt[t] = Math.min(8, Math.max(1, (o.cnt[t] || 1) + (+el.dataset.d))); rerender(); }
  else if (a === "ob-rm-custom") { o.custom.splice(+el.dataset.i, 1); rerender(); }
  else if (a === "ob-mode") { o.mode = el.dataset.v; rerender(); }
  else if (a === "ob-off") { o.off[el.dataset.v] = !o.off[el.dataset.v]; rerender(); }
  else if (a === "ob-nodate") { if ($("#obEntrega")) o.entrega = $("#obEntrega").value; o.semData = !o.semData; rerender(); }
  else if (a === "ob-back") { o.step = Math.max(2, o.step - 1); render("enter-pop"); window.scrollTo(0, 0); }
  else if (a === "ob-sair") { S.ob = null; S.store.logout(); }
  else if (a === "ob-finish") finishOnboarding(el);
  else if (a === "ob-next") {
    const err = $("#obErr");
    if (o.step === 2) {
      if (!o.n1.trim()) { err.textContent = "Escreva seu nome."; $("#obN1")?.focus(); return; }
      if (o.casal && !o.n2.trim()) { err.textContent = "Escreva o nome do par."; $("#obN2")?.focus(); return; }
    }
    if (o.step === 3 && !obRooms().length) { err.textContent = "Escolha pelo menos um cômodo."; return; }
    o.step++; render("enter-push"); window.scrollTo(0, 0);
  }
}

document.addEventListener("scroll", e => {
  if (e.target.id !== "photos") return;
  const p = e.target, i = Math.round(p.scrollLeft / p.clientWidth);
  document.querySelectorAll(".dots i").forEach((d, k) => d.classList.toggle("on", k === i));
}, true);

window.addEventListener("hashchange", navigate);

/* ===================================================================
   INÍCIO
   =================================================================== */
let unsub = null;
async function start() {
  try { S.store = DEMO ? makeDemoStore() : await makeFirebaseStore(); }
  catch (err) {
    console.error(err);
    $("#app").innerHTML = `<div class="empty-state" style="min-height:100vh;justify-content:center"><b>Não deu pra conectar</b><span>Confira a internet e as chaves do Firebase no index.html.</span><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`;
    return;
  }
  S.store.onAuth(user => {
    S.user = user;
    if (unsub) { unsub(); unsub = null; }
    if (user) {
      S.loaded = false;
      S.casaId = casaIdFor(user);
      S.items = new Map(); S.settings = {}; S.photos = {}; S.ob = null; S.introDone = false;
      S.authMode = "entrar"; S.authEmail = "";
      applyRooms();
      let gotItems = false, gotSettings = false;
      const ready = () => { if (gotItems && gotSettings && !S.loaded) { S.loaded = true; refresh(); } else if (S.loaded) refresh(); };
      unsub = S.store.subscribe(S.casaId,
        arr => {
          S.items = new Map(arr.map(i => [i.id, i]));
          gotItems = true; ready();
        },
        st => { S.settings = st || {}; applyRooms(); gotSettings = true; ready(); },
        err => { console.error(err); S.loaded = true; refresh(); toast(err?.code === "permission-denied" ? "Este e-mail não tem acesso à lista" : "Erro ao carregar a lista"); }
      );
    } else { S.items = new Map(); S.settings = {}; S.loaded = false; applyRooms(); }
    S.route = parseRoute();
    render("enter-fade");
  });
}
start();
</script>
