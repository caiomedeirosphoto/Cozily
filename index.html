      const paint = () => {
        $(".sheet-bar h2", ov).textContent = gift ? "Presente!" : "Comprado!";
        $("#pGiftWrap", ov).classList.toggle("hidden", !gift);
        $("#pPagoWrap", ov).classList.toggle("hidden", gift);

        $("[data-confirm]", ov).innerHTML = gift ? `${ic("gift", 20, 2.2)} Marcar como presente` : `${ic("check", 20, 2.6)} Marcar como comprado`;
        $("#pNote", ov).textContent = gift ? "Presente não mexe na caixinha de vocês" : "A gente já desconta da caixinha pra você";
        pickSeg($("#pKind", ov), gift ? 1 : 0);

      });
      $("[data-confirm]", ov).onclick = () => ov._save();

      setTimeout(() => { if (!skip) $(gift ? "#pDe" : "#pPago", ov)?.focus(); }, 420);
    },
    async onSave(ov) {
      const patch = { id, comprado: true, presente: gift, atualizadoEm: Date.now(), data: $("#pData", ov).value || today() };

      else if (!skip) { patch.presenteDe = null; patch.valorPago = parseMoney($("#pPago", ov).value); patch.loja = $("#pLoja", ov).value.trim() || null; }
      if (!skip) patch.garantia = $("#pGar", ov).value || null;

      return true;
    }
  });
}

/* fotos dentro de uma folha */
function setupPhotos(ov, photos, onChange) {
  const box = $("#fPhotos", ov);
  const draw = () => {
    box.innerHTML = photos.map((p, i) => `<div class="ph"><img src="${p}" alt="Foto ${i + 1}"><button type="button" class="rm" data-rm="${i}" aria-label="Tirar foto ${i + 1}">${ic("x", 14, 2.6)}</button></div>`).join("")
      + (photos.length < 3 ? `<button type="button" class="ph-add" id="phAdd">${ic("camera", 24, 1.8)}Colocar</button>` : "");
  };
  draw();
  box.onclick = e => {
    const rm = e.target.closest("[data-rm]");
    if (rm) { photos.splice(+rm.dataset.rm, 1); onChange(); draw(); return; }
    if (e.target.closest("#phAdd")) {
      const fp = $("#filepick"); fp.value = "";
      fp.onchange = async () => {
        const f = fp.files[0]; if (!f) return;
        const add = $("#phAdd", ov); if (add) add.innerHTML = `<div class="spinner"></div>`;
        try { photos.push(await processPhoto(f)); onChange(); } catch (err) { toast(err.message || "Não deu pra usar essa foto"); }
        draw();
      };
      fp.click();
    }
  };
}

function novaListaMercado(ym) {
  const prevs = [...S.mercado.keys()].filter(k => k < ym).sort();
  const base = prevs.length ? (S.mercado.get(prevs[prevs.length - 1]).itens || []).map(i => ({ ...i, ok: false }))
    : MERCADO_BASE.flatMap(([cat, l]) => l.map(([nome, qtd]) => ({ id: uid() + slug(nome).slice(0, 6), nome, qtd, cat, ok: false })));

let listaTimer = 0, listaSent = "";
function listaPublica() {
  const L = S.settings.lista; if (!L || !L.slug) return null;
  const itens = (L.itens || []).map(id => S.items.get(id)).filter(i => i && !i.excluido && !isDone(i)).map(i => {
    const r = ROOM[i.comodo]; const precos = {};
    ofertasDo(i).forEach(o => { const k = slug(o.loja || "").replace(/-/g, ""); if (LOJAS[k] && (!precos[k] || o.preco < precos[k])) precos[k] = o.preco; });
    return { id: i.id, nome: i.nome, sub: (r ? r.nome : "") + (i.valorPrevisto ? " · cerca de " + money0(i.valorPrevisto) : ""), precos };
  });
  return { casaId: S.casaId, ativa: true, tipo: L.tipo || "Chá de casa nova", data: L.data || "", pix: L.pix || "", nomes: nomesCasa() || S.settings.nomeCasa || "", itens };
}
function syncLista(now) {
  clearTimeout(listaTimer);
  listaTimer = setTimeout(() => {
    const p = listaPublica(); if (!p) return;
    const j = JSON.stringify(p); if (j === listaSent) return;
    listaSent = j;
    S.store.putLista(S.settings.lista.slug, p).catch(err => { console.error(err); listaSent = ""; });
  }, now ? 0 : 1200);
}
async function criarLista() {
  let base = slug(nomesCasa() || S.settings.nomeCasa || "nossa-lista").slice(0, 40), s = base;
  for (let i = 0; i < 4 && !(await S.store.listaLivre(s)); i++) s = base + "-" + Math.random().toString(36).slice(2, 6);
  const lista = { slug: s, tipo: "Chá de casa nova", data: "", pix: "", itens: [] };
  S.settings = { ...S.settings, lista };
  await S.store.putSettings({ lista }).catch(err => { console.error(err); toast("Não deu pra criar a lista. Confere a internet?"); });

function juntosBody() {
  return `<div class="card" style="gap:0;padding:4px 16px" id="jList">${membrosHtml()}</div>
    <form id="jForm" class="field"><label for="jEmail">Convidar mais alguém</label>

function inviteOkHtml(email, nome) {
  return `<div class="tip mist" style="flex-direction:column;gap:10px;padding:14px">
    <div class="row" style="align-items:flex-start;gap:10px">${ic("mail", 18, 2)}<p><b>Prontinho, convite enviado pra ${esc(nome)}!</b> Às vezes o e-mail se esconde no <b>spam ou lixo eletrônico</b>, então pede pra ${/a$/i.test(nome) ? "ela" : "essa pessoa"} dar uma olhadinha lá também. Também dá pra entrar direto pelo app, com o Google ou criando a conta, usando esse mesmo e-mail.</p></div>
    <button class="btn mist sm" type="button" data-resend="${esc(email)}">Reenviar convite</button>
  </div>`;
}
function wireJuntos(root) {
  const form = $("#jForm", root);
  form.onsubmit = async e => {
    e.preventDefault();
    const inp = $("#jEmail", root), email = inp.value.trim().toLowerCase(), err = $("#jErr", root);
    err.textContent = "";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "Esse e-mail não parece certinho."; return; }
    if ((S.settings.membros || []).includes(email)) { err.textContent = "Essa pessoa já está na casa."; return; }
    const btn = $("button[type=submit]", form); btn.disabled = true; btn.textContent = "Enviando…";
    const r = await convidar(email);
    btn.disabled = false; btn.textContent = "Convidar";
    if (r === false) { err.textContent = "Não deu pra convidar agora. Confere a internet e tenta de novo?"; return; }
    inp.value = "";
    $("#jList", root).innerHTML = membrosHtml();
    S.lastInvite = { email, nome: email.split("@")[0].replace(/[._-]+/g, " ").replace(/\d+/g, "").trim().replace(/^\w/, c => c.toUpperCase()) || "essa pessoa" };
    $("#jOk", root).innerHTML = inviteOkHtml(S.lastInvite.email, S.lastInvite.nome);
  };
  root.addEventListener("click", async e => {
    const rs = e.target.closest("[data-resend]");
    if (rs) { rs.disabled = true; const r = await convidar(rs.dataset.resend, true); rs.disabled = false; toast(r === false ? "Não deu pra reenviar agora" : "Convite reenviado! Dá uma olhadinha no spam também."); }
    const un = e.target.closest("[data-unv]");
    if (un) {
      const email = un.dataset.unv;
      const membros = (S.settings.membros || []).filter(x => x !== email);
      S.settings = { ...S.settings, membros };
      write(S.store.putSettings({ membros })); write(S.store.uninvite(email));
      $("#jList", root).innerHTML = membrosHtml(); toast("Convite cancelado");
    }
  });
}
async function convidar(email, resend) {
  try {
    if (!resend) {
      const membros = [...new Set([...(S.settings.membros || [S.user.email]), S.user.email, email])];
      S.settings = { ...S.settings, membros };
      await S.store.putSettings({ membros });
    }
    await S.store.invite(email, meuNome());
    return true;
  } catch (err) {
    console.error(err);
    if ((err?.code || "").includes("operation-not-allowed") || (err?.code || "").includes("unauthorized-continue-uri")) {
      toast("Convite salvo! O envio por e-mail ainda vai ser ligado. Ela pode criar a conta com esse e-mail.");
      return true;
    }
    return false;
  }
}

        if (!nome) { const same = list.filter(r => r.tipo === tipo).length; nome = same ? `${T.nome} ${same + 1}` : T.nome; }
        const base = tipo === "outro" ? "c-" + slug(nome) : tipo;
        let id = base, k = 2; while (list.some(r => r.id === id)) id = base + "-" + k++;
        const ct = list.findIndex(r => (TIPOS[r.tipo] || {}).casaToda);
        list.splice(T.casaToda || ct < 0 ? list.length : ct, 0, { id, nome, tipo });
        $("#rNome", ov).value = ""; box.innerHTML = draw();
      };
    },
    async onSave() {
      list = list.map(r => ({ ...r, nome: r.nome.trim() || (TIPOS[r.tipo] || TIPOS.outro).nome }));
      S.settings = { ...S.settings, comodos: list }; applyRooms();
      write(S.store.putSettings({ comodos: list }));
      S.dirty = true; toast("Cômodos atualizados"); return true;
    }
  });
}

function write(p, msg = "Não deu pra salvar. Confere a internet?") {

function toggleItem(id) {

}
function unmark(id) {
  const it = S.items.get(id); if (!it) return;
  const patch = { id, comprado: false, presente: false, atualizadoEm: Date.now() };
  S.items.set(id, { ...it, ...patch });
  write(S.store.putItem(patch));
  S.popId = id; rerender();
  toast(`${it.nome} voltou pra “falta”`, "Desfazer", () => { S.items.set(id, it); write(S.store.putItem({ id, comprado: true, presente: !!it.presente, atualizadoEm: Date.now() })); S.popId = id; refresh(); });
}
function changeQtd(id, d) {
  const it = S.items.get(id); if (!it) return;
  const need = temQtd(it), have = qtdTem(it);
  const q = Math.max(0, Math.min(99, have + d));
  if (q === have) return;
  if (q === 0) { const p = { id, comprado: false, qtd: 0, atualizadoEm: Date.now() }; S.items.set(id, { ...it, ...p }); write(S.store.putItem(p)); rerender(); return; }
  if (!it.comprado) { openMarcar(id); return; }
  const p = { id, qtd: q, atualizadoEm: Date.now() };
  S.items.set(id, { ...it, ...p }); write(S.store.putItem(p)); rerender();
  if (q === need) toast("Completinho! Agora é só aproveitar.");
}
function deleteItem(id) {
  const it = S.items.get(id); if (!it) return;
  openSheet("Tirar da lista", `<p style="margin:0;font-size:16px;line-height:1.45">Tirar <b>${esc(it.nome)}</b> da lista? Ele vai pra lixeira e dá pra trazer de volta em Ajustes › Itens excluídos.</p>
    <button class="btn primary block" data-yes type="button" style="background:var(--danger);color:#fff">Tirar da lista</button>`, {
    onMount(ov, close) { $("[data-yes]", ov).onclick = () => { close(); reallyDelete(id, it); }; }
  });
}
function reallyDelete(id, it) {
  const patch = { id, excluido: true, excluidoEm: Date.now() };
  S.items.set(id, { ...it, ...patch });
  write(S.store.putItem(patch));
  if (S.route?.name === "item") back("#/c/" + encodeURIComponent(it.comodo)); else refresh();
  toast(`${it.nome} foi pra lixeira`, "Desfazer", () => restoreItem(id), 10000);
}
function restoreItem(id) {
  const it = S.items.get(id);
  if (it) { S.items.set(id, { ...it, excluido: false, excluidoEm: null }); write(S.store.putItem({ id, excluido: false, excluidoEm: null, atualizadoEm: Date.now() })); }
  else { const seed = buildSeed().find(i => i.id === id); if (!seed) return; S.items.set(id, seed); write(S.store.putItem(seed)); }
  S.popId = id;

}
function purgeItem(id) { S.items.delete(id); delete S.photos[id]; write(S.store.delItem(id)); write(S.store.putPhotos(id, [])); }
function openTrash() {
  const row = (it, kind) => { const r = ROOM[it.comodo] || ROOMS[0]; return `<div class="item">
    <span class="item-txt grow"><span class="item-name">${esc(it.nome)}</span><span class="meta"><span>${esc(r?.nome || "")}</span>${kind === "lixo" && it.excluidoEm ? `<span>· ${fmtDay(ymd(new Date(it.excluidoEm)))}</span>` : kind === "seed" ? "<span>· da lista original</span>" : ""}</span></span>

    ${kind === "lixo" ? `<button data-purge="${esc(it.id)}" aria-label="Apagar ${esc(it.nome)} de vez" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--danger)">${ic("trash", 18, 2)}</button>` : ""}
  </div>`; };
  const draw = () => {
    const l = lixeira(), sm = sumidos();
    return (l.length ? `<div class="grp-h"><h3>Lixeira</h3><span>${l.length}</span></div><div class="items">${l.map(i => row(i, "lixo")).join("")}</div>` : "")
      + (sm.length ? `<div class="grp-h"><h3>Apagados da lista original</h3><span>${sm.length}</span></div><div class="items">${sm.map(i => row(i, "seed")).join("")}</div>` : "")
      + (!l.length && !sm.length ? empty("Nada excluído", "O que vocês tirarem da lista aparece aqui e dá pra trazer de volta.") : "");
  };
  openSheet("Itens excluídos", `<div id="trashBox" style="display:flex;flex-direction:column;gap:10px">${draw()}</div>`, {

}
async function loadPhotos(id) {
  if (S.photos[id] !== undefined || S.pending.has(id)) return;
  const it = S.items.get(id);
  if (!it || !it.thumb) { S.photos[id] = []; return; }
  S.pending.add(id);
  try { S.photos[id] = await S.store.getPhotos(id); } catch { S.photos[id] = [it.thumb]; }

}
let toastTimer;
function toast(msg, actionLabel, action, ms = 3400, opt = {}) {
  document.querySelector(".toast")?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement("div");
  const top = !!document.querySelector(".overlay:not(.closing)");
  t.className = "toast" + (opt.ok ? " ok" : "") + (top ? " top" : ""); t.setAttribute("role", "status");
  t.innerHTML = (opt.ok ? `<span class="tk" aria-hidden="true">${ic("check", 16, 3)}</span>` : "")
    + `<span class="tx">${opt.title ? `<b>${esc(opt.title)}</b>` : ""}<span>${esc(msg)}</span></span>`
    + (actionLabel ? `<button type="button">${esc(actionLabel)}</button><i style="animation-duration:${ms}ms"></i>` : "");
  if (actionLabel) $("button", t).onclick = () => { clearTimeout(toastTimer); t.remove(); action(); };
  document.body.appendChild(t);
  toastTimer = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 220); }, ms);
}

async function saveMoradia() {
  const o = obState();
  if ($("#obEntrega")) o.entrega = $("#obEntrega").value;
  const s = {
    nomeCasa: o.casa.trim() || "Nossa casa", tipoMoradia: o.tipo, situacao: o.sit, entrega: o.semData ? null : (o.entrega || null),
    nomes: S.settings.nomes || meuNome(), membros: [...new Set([...(S.settings.membros || []), S.user.email])], membrosOk: [...new Set([...(S.settings.membrosOk || []), S.user.email])], dono: S.user.uid
  };
  S.settings = { ...S.settings, ...s };
  await S.store.putSettings(s);
}
async function finishOnboarding(btn) {
  const o = obState();
  const comodos = [...obRooms(), ...CASA_TODA].map(({ id, nome, tipo }) => ({ id, nome, tipo }));
  const mem = (S.settings.membros || []).length;
  const settings = { ...guiaNovo(), onboarded: true, importado: true, criadoEm: Date.now(), comodos, comecouDoZero: o.mode !== "sug", v3: true, moradores: o.sozinho ? 1 : Math.max(2, mem) };
  const items = o.mode === "sug" ? buildSeedFor(comodos.filter(r => !o.off[r.id])) : [];
  if (btn) { btn.disabled = true; btn.textContent = "Montando a casa…"; }
  S.settings = { ...S.settings, ...settings };
  applyRooms();
  items.forEach(i => S.items.set(i.id, i));
  try {
    await S.store.putSettings(settings);
    if (items.length) S.store.seed(items).catch(err => { console.error(err); toast("A lista não terminou de salvar. Confere a internet?"); });
  } catch (err) {
    console.error(err);
    if (btn) { btn.disabled = false; btn.textContent = "Tentar de novo"; }
    toast(err?.code === "permission-denied" ? "Sem permissão pra salvar. Confere as regras do Firestore." : "Não deu pra criar a casa. Confere a internet?");
    return;
  }
  S.ob = null; S.introDone = false;
  S.post = isStandalone() ? ["avisos"] : ["avisos", "instalar"];
  if (location.hash && location.hash !== "#/") go("#/"); else render("enter-fade");
  window.scrollTo(0, 0);
}
function obAction(a, el) {
  const o = obState();
  if (a === "ob-tipo") { o.tipo = el.dataset.v; rerender(); }
  else if (a === "ob-sit") { if ($("#obEntrega")) o.entrega = $("#obEntrega").value; o.sit = el.dataset.v; rerender(); }
  else if (a === "ob-nodate") { if ($("#obEntrega")) o.entrega = $("#obEntrega").value; o.semData = !o.semData; rerender(); }
  else if (a === "ob-cnt") { const t = el.dataset.v; o.cnt[t] = Math.min(6, Math.max(0, (o.cnt[t] || 0) + (+el.dataset.d))); rerender(); }
  else if (a === "ob-rm-custom") { o.custom.splice(+el.dataset.i, 1); rerender(); }
  else if (a === "ob-mode") { o.mode = el.dataset.v; rerender(); }
  else if (a === "ob-off") { o.off[el.dataset.v] = !o.off[el.dataset.v]; rerender(); }
  else if (a === "ob-open") { o.open = o.open === el.dataset.v ? null : el.dataset.v; rerender(); }
  else if (a === "ob-go") { o.step = el.dataset.v; render("enter-pop"); window.scrollTo(0, 0); }
  else if (a === "ob-sair") { S.ob = null; S.store.logout(); }
  else if (a === "ob-finish") finishOnboarding(el);
  else if (a === "ob-sozinho") { o.sozinho = true; o.step = "comodos"; o.cnt.quarto = 1; o.cnt.banheiro = 1; render("enter-push"); window.scrollTo(0, 0); }
  else if (a === "ob-next") {
    const err = $("#obErr");
    if (o.step === "moradia") {
      o.casa = $("#obCasa")?.value || o.casa;
      el.disabled = true;
      saveMoradia().then(() => { o.step = "juntos"; render("enter-push"); window.scrollTo(0, 0); })
        .catch(e => { console.error(e); el.disabled = false; if (err) err.textContent = e?.code === "permission-denied" ? "Sem permissão pra salvar. Confere as regras do Firestore." : "Não deu pra salvar. Confere a internet?"; });
      return;
    }
    if (o.step === "juntos") { o.sozinho = false; o.step = "comodos"; }
    else if (o.step === "comodos") {
      if (!obRooms().length) { err.textContent = "Escolhe pelo menos um cômodo."; return; }
      if (o.mode !== "sug") { finishOnboarding(el); return; }
      o.step = "sugestao";
    }
    render("enter-push"); window.scrollTo(0, 0);
  }
}

    S.store.reset(email).then(() => toast("Mandamos um link pra criar uma senha nova. Olha o spam também!")).catch(() => toast("Não deu pra mandar. Confere o e-mail?"));
  }
});

document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "lEmail") S.authEmail = e.target.value;
  if (id === "lNome") S.authNome = e.target.value;
  if (id === "obCasa" && S.ob) S.ob.casa = e.target.value;
  if (id === "obEntrega" && S.ob) S.ob.entrega = e.target.value;

document.addEventListener("focusout", () => { setTimeout(() => { if (S.dirty && !document.querySelector(".overlay") && !(document.activeElement && document.activeElement.matches("#app input,#app textarea"))) { S.dirty = false; refresh(); } }, 50); });

document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "obCustomForm") {
    e.preventDefault();
    const nome = $("#obCustom").value.trim(); if (!nome) return;
    const o = obState(); if (!o.custom.some(c => c.toLowerCase() === nome.toLowerCase())) o.custom.push(nome);
    rerender(); return;
  }
  if (f.id === "mAdd") {
    e.preventDefault();
    const inp = $("#mNovo"), txt = inp.value.trim(); if (!txt) return;
    const ym = f.dataset.ym, d = S.mercado.get(ym); if (!d) return;
    const p = parseMercado(txt);
    const it = { id: uid(), nome: p.nome, qtd: p.qtd, cat: guessCat(p.nome), ok: false };
    saveMercado(ym, [...d.itens, it]);
    S.mFilter = S.mFilter === "ok" ? "all" : S.mFilter;
    rerender(); setTimeout(() => $("#mNovo")?.focus(), 30);
    toast(`${p.nome} entrou em ${it.cat}`);
    return;
  }
  if (f.id === "linkForm") {
    e.preventDefault();
    const nome = $("#kNome").value.trim(), email = $("#kEmail").value.trim(), err = $("#kErr"), btn = $("#kBtn");
    if (!nome) { err.textContent = "Escreve seu nome."; return; }
    if (!email) { err.textContent = "Escreve o e-mail que recebeu o convite."; return; }
    btn.disabled = true; btn.textContent = "Entrando…";
    S.pendingName = nome;
    try { await S.store.completeLink(email, location.href); }
    catch (x) { console.error(x); btn.disabled = false; btn.textContent = "Entrar na casa"; err.textContent = (x?.code || "").includes("invalid-email") ? "Esse e-mail não é o mesmo do convite." : (x?.code || "").includes("expired") || (x?.code || "").includes("invalid-action") ? "Esse link já foi usado ou venceu. Pede pra mandarem de novo?" : "Não deu pra entrar. Tenta de novo?"; }
    return;
  }
  if (f.id !== "loginForm") return;
  e.preventDefault();
  const criar = S.authMode === "criar";
  const email = $("#lEmail").value.trim(), senha = $("#lSenha").value, nome = $("#lNome")?.value.trim() || "";
  const err = $("#lErr"), btn = $("#lBtn");
  err.textContent = "";
  if (criar && !nome) { err.textContent = "Como você se chama?"; return; }
  if (!email || !senha) { err.textContent = "Preenche o e-mail e a senha."; return; }
  if (criar && senha.length < 6) { err.textContent = "A senha precisa ter pelo menos 6 caracteres."; return; }
  btn.disabled = true; btn.textContent = criar ? "Criando a conta…" : "Entrando…";
  try {
    S.ob = null;
    if (criar) { S.pendingName = nome; await S.store.createAccount(email, senha, nome); }
    else await S.store.login(email, senha);
  } catch (x) {
    const c = x?.code || "";
    err.textContent = c.includes("email-already-in-use") ? "Já existe uma conta com esse e-mail. Toca em Entrar."
      : c.includes("invalid-email") ? "Esse e-mail não parece certinho."
      : c.includes("weak-password") ? "Escolhe uma senha mais forte (6 caracteres ou mais)."
      : c.includes("operation-not-allowed") || c.includes("admin-restricted") ? "A criação de contas está desligada no Firebase."
      : c.includes("invalid") || c.includes("wrong-password") || c.includes("user-not-found") ? "E-mail ou senha não batem. Confere e tenta de novo?"
      : c.includes("too-many") ? "Muitas tentativas. Espera um pouquinho e tenta de novo."
      : c.includes("network") ? "Sem internet no momento." : (criar ? "Não deu pra criar a conta. Tenta de novo?" : "Não deu pra entrar. Tenta de novo?");
    btn.disabled = false; btn.textContent = criar ? "Criar conta" : "Entrar";
  }
});

/* foto em tela cheia */
function openViewer(list, start = 0, nome = "") {
  if (!list.length) return;
  const v = document.createElement("div");
  v.className = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-modal", "true"); v.setAttribute("aria-label", "Foto de " + nome);
  v.innerHTML = `<div class="vtrack">${list.map((p, i) => `<div class="vslide"><img src="${p}" alt="Foto ${i + 1} de ${esc(nome)}" draggable="false"></div>`).join("")}</div>
    <div class="vbar"><button type="button" data-vx aria-label="Fechar">${ic("x", 22, 2.2)}</button><span>${list.length > 1 ? `<b data-vn>${start + 1}</b> de ${list.length}` : ""}</span><span style="width:44px"></span></div>`;
  document.body.appendChild(v);
  document.body.style.overflow = "hidden";
  const track = $(".vtrack", v);
  requestAnimationFrame(() => { track.scrollLeft = start * track.clientWidth; });
  let cur = start;
  track.addEventListener("scroll", () => { cur = Math.round(track.scrollLeft / track.clientWidth); const n = $("[data-vn]", v); if (n) n.textContent = cur + 1; }, { passive: true });
  const close = () => { if (v.classList.contains("closing")) return; v.classList.add("closing"); document.removeEventListener("keydown", onKey); setTimeout(() => { v.remove(); document.body.style.overflow = ""; }, 200); };
  const onKey = e => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight" || e.key === "ArrowLeft") track.scrollBy({ left: (e.key === "ArrowRight" ? 1 : -1) * track.clientWidth, behavior: "smooth" }); };
  document.addEventListener("keydown", onKey);
  $("[data-vx]", v).onclick = close;
  let sc = 1, tx = 0, ty = 0, pinch = null, pan = null, drag = null, lastTap = 0, tap = null, lastTouch = 0;
  const img = () => track.children[cur].querySelector("img");
  const apply = (el, anim) => { el.style.transition = anim ? "transform .25s var(--ease)" : "none"; el.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; v.classList.toggle("zoomed", sc > 1.01); };
  const clamp = el => { const w = el.offsetWidth, h = el.offsetHeight; tx = Math.min(0, Math.max(Math.min(0, w - w * sc), tx)); ty = Math.min(0, Math.max(Math.min(0, h - h * sc), ty)); if (sc <= 1) { sc = 1; tx = 0; ty = 0; } };
  const local = (el, x, y) => { const r = el.getBoundingClientRect(); return { x: (x - r.left) / sc, y: (y - r.top) / sc }; };
  const toggleZoom = (el, x, y) => { if (sc > 1) { sc = 1; tx = 0; ty = 0; } else { const p = local(el, x, y); sc = 2.5; tx = -p.x * (sc - 1); ty = -p.y * (sc - 1); clamp(el); } apply(el, true); };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });
  v.addEventListener("touchstart", e => {
    const el = img(); if (!el) return;
    if (e.touches.length === 2) { drag = null; pan = null; const m = mid(e.touches), base = el.getBoundingClientRect(); pinch = { d: dist(e.touches), sc, tx, ty, ox: m.x - (base.left - tx), oy: m.y - (base.top - ty) }; }
    else if (e.touches.length === 1) { const t = e.touches[0]; tap = { x: t.clientX, y: t.clientY, at: Date.now() }; if (sc > 1) pan = { x: t.clientX, y: t.clientY, tx, ty }; else drag = { x: t.clientX, y: t.clientY, dy: 0, lock: null }; }
  }, { passive: true });
  v.addEventListener("touchmove", e => {
    const el = img(); if (!el) return;
    if (pinch && e.touches.length === 2) { e.preventDefault(); const ns = Math.min(5, Math.max(1, pinch.sc * dist(e.touches) / pinch.d)), k = ns / pinch.sc; sc = ns; tx = pinch.ox - (pinch.ox - pinch.tx) * k; ty = pinch.oy - (pinch.oy - pinch.ty) * k; apply(el); }
    else if (pan && e.touches.length === 1) { e.preventDefault(); const t = e.touches[0]; tx = pan.tx + t.clientX - pan.x; ty = pan.ty + t.clientY - pan.y; apply(el); if (tap && Math.hypot(t.clientX - tap.x, t.clientY - tap.y) > 10) tap = null; }
    else if (drag && e.touches.length === 1) {
      const t = e.touches[0], dx = t.clientX - drag.x, dy = t.clientY - drag.y;
      if (tap && Math.hypot(dx, dy) > 10) tap = null;
      if (!drag.lock && Math.hypot(dx, dy) > 8) drag.lock = Math.abs(dy) > Math.abs(dx) ? "y" : "x";
      if (drag.lock === "y") { e.preventDefault(); drag.dy = Math.max(0, dy); v.classList.add("dragging"); el.style.transition = "none"; el.style.transform = `translateY(${drag.dy}px) scale(${1 - Math.min(.25, drag.dy / 1600)})`; v.style.background = `rgba(0,0,0,${1 - Math.min(.7, drag.dy / 500)})`; }
    }
  }, { passive: false });
  v.addEventListener("touchend", e => {
    lastTouch = Date.now();
    const el = img(); if (!el) return;
    if (tap && !pinch && !e.touches.length && Date.now() - tap.at < 300) {
      const now = Date.now(), t = tap; tap = null;
      if (now - lastTap < 300 && e.target.closest("img")) { lastTap = 0; pan = null; drag = null; v.classList.remove("dragging"); toggleZoom(el, t.x, t.y); return; }
      lastTap = now;
    }
    if (pinch && e.touches.length < 2) { pinch = null; clamp(el); apply(el, true); if (e.touches.length === 1 && sc > 1) { const t = e.touches[0]; pan = { x: t.clientX, y: t.clientY, tx, ty }; } return; }
    if (pan && !e.touches.length) { pan = null; clamp(el); apply(el, true); }
    if (drag && !e.touches.length) {
      const d = drag; drag = null; v.classList.remove("dragging");
      if (d.lock === "y" && d.dy > 110) { el.style.transition = "transform .2s ease-in"; el.style.transform = `translateY(${innerHeight}px)`; close(); return; }
      if (d.lock === "y") { el.style.transition = "transform .25s var(--ease)"; el.style.transform = ""; v.style.background = ""; }
    }
  });
  v.addEventListener("dblclick", e => { const el = img(); if (!el || !e.target.closest("img") || Date.now() - lastTouch < 800) return; toggleZoom(el, e.clientX, e.clientY); });
  setTimeout(() => $("[data-vx]", v).focus({ preventScroll: true }), 50);
}
document.addEventListener("scroll", e => {
  if (e.target.id !== "photos") return;
  const p = e.target, i = Math.round(p.scrollLeft / p.clientWidth);
  $$(".dots i").forEach((d, k) => d.classList.toggle("on", k === i));

window.addEventListener("hashchange", navigate);

/* ===================================================================
   MIGRAÇÕES (uma vez só, sem mexer no que já existe)
   =================================================================== */
let migrando = false;
function migrateEtapas() {
  if (migrando || !S.loaded || S.casaId !== "nosso-ap" || S.settings.etapasV2 || !S.items.size) return;
  migrando = true;
  const sug = new Map(buildSeed().map(it => [it.id, it.etapa]));
  const list = [];
  for (const it of S.items.values()) { const e = sug.get(it.id); if (!it.etapa && e) { it.etapa = e; list.push({ id: it.id, etapa: e }); } }
  S.settings.etapasV2 = true;
  (list.length ? S.store.patchMany(list) : Promise.resolve()).then(() => S.store.putSettings({ etapasV2: true }))
    .catch(err => { console.error(err); S.settings.etapasV2 = false; }).finally(() => { migrando = false; });
}
/* v3: cômodo Ferramentas e utilidades e os itens novos da lista sugerida */
let migrandoV3 = false;
function migrateV3() {
  if (migrandoV3 || !S.loaded || S.settings.v3 || !(S.settings.onboarded || S.settings.importado) || !S.items.size) return;
  migrandoV3 = true;
  const patch = { v3: true };
  if (S.settings.comodos && !S.settings.comodos.some(r => r.tipo === "ferramentas")) { patch.comodos = [...S.settings.comodos, { id: "ferramentas", nome: TIPOS.ferramentas.nome, tipo: "ferramentas" }]; }
  S.settings = { ...S.settings, ...patch };
  applyRooms();
  const novos = [];
  if (!S.settings.comecouDoZero) {
    let k = 0;
    for (const r of ROOMS) for (const [, topico, l] of seedRowsFor(r.tipo)) for (const raw of l) {
      const { nome, etapa } = parseSeedName(raw);
      if (r.tipo !== "ferramentas" && !NOVOS_V3.has(slug(nome))) continue;
      const id = `${r.id}--${slug(topico || "geral")}--${slug(nome)}`;
      if (S.items.has(id)) continue;
      const it = { id, nome, comodo: r.id, topico, comprado: false, etapa, ordem: Date.now() + k++, criadoEm: Date.now() };
      novos.push(it); S.items.set(id, it);
    }
  }
  (novos.length ? S.store.patchMany(novos) : Promise.resolve()).then(() => S.store.putSettings(patch))
    .then(() => { refresh(); if (novos.length) toast(`Chegaram ${novos.length} itens novos na lista, como Ferramentas e utilidades`); })
    .catch(err => { console.error(err); S.settings.v3 = false; }).finally(() => { migrandoV3 = false; });
}
/* quem é da casa entra na lista de membros; quem chegou por convite avisa que chegou */
let membroOk = false;
function ensureMembro() {
  if (membroOk || !S.loaded || !S.user) return;
  const st = S.settings, email = S.user.email;
  if (!(st.onboarded || st.importado)) return;
  membroOk = true;
  const patch = {};
  if (!(st.membros || []).includes(email)) patch.membros = [...new Set([...(st.membros || []), email])];
  const dono = S.casaId === S.user.uid || LEGACY[email] === S.casaId;
  if (!dono && !(st.membrosOk || []).includes(email)) {
    const nome = meuNome() || email.split("@")[0];
    patch.membrosOk = [...new Set([...(st.membrosOk || []), email])];
    patch.chegadas = [...(st.chegadas || []), { email, nome, em: Date.now() }];
    Object.assign(patch, guiaNovo());
    if (st.nomes && !norm(st.nomes).includes(norm(nome))) patch.nomes = st.nomes + " e " + nome;
    S.post = isStandalone() ? ["avisos"] : ["avisos", "instalar"];
    setTimeout(() => toast(`Bem-vindo(a) ao ${st.nomeCasa || "Cozily"}!`), 600);
  }
  if (Object.keys(patch).length) { S.settings = { ...S.settings, ...patch }; write(S.store.putSettings(patch)); }
}

/* ===================================================================
   INÍCIO
   =================================================================== */
let unsubs = [], resUnsub = null, resSlug = null;
function watchReservas() {
  const s = S.settings.lista?.slug || null;
  if (s === resSlug) return;
  resUnsub && resUnsub(); resUnsub = null; resSlug = s; S.reservas = [];
  if (s) resUnsub = S.store.watchReservas(s, r => { S.reservas = r; refresh(); });
}
function onData() {
  if (!S.loaded) return;
  migrateEtapas(); migrateV3(); ensureMembro(); watchReservas(); syncLista(); checkGarantias();
  refresh();
}
async function start() {
  try { S.store = DEMO ? makeDemoStore() : await makeFirebaseStore(); }
  catch (err) {
    console.error(err);
    $("#app").innerHTML = `<div class="empty" style="min-height:100vh;justify-content:center"><b>Não deu pra conectar</b><span>Confere a internet e tenta de novo.</span><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`;
    return;
  }
  if (S.afterStore) { S.afterStore(); S.afterStore = null; }
  const params = new URLSearchParams(location.search);
  if (S.store.isLink(location.href)) { S.linkMode = true; S.linkEmail = params.get("convite") || ""; }
  if (typeof Notification !== "undefined" && Notification.permission === "granted") registerSW();
  S.store.onAuth(async user => {
    unsubs.forEach(u => u && u()); unsubs = []; resUnsub && resUnsub(); resUnsub = null; resSlug = null;
    S.user = user;
    if (user) {
      if (S.pendingName && !user.nome) { user.nome = S.pendingName; S.store.setName(S.pendingName).catch(() => {}); }
      S.pendingName = null;
      if (S.linkMode) { S.linkMode = false; history.replaceState(null, "", location.pathname + location.hash); }
      S.loaded = false; S.items = new Map(); S.settings = {}; S.photos = {}; S.ob = null; S.introDone = false; S.post = null;
      S.movs = []; S.compras = []; S.mercado = new Map(); S.reservas = []; membroOk = false; listaSent = "";
      S.authMode = "entrar"; S.authEmail = ""; S.authNome = ""; S.lastInvite = null;
      render(null);
      S.casaId = await S.store.resolveCasa(user);
      applyRooms();
      let gotItems = false, gotSettings = false;
      const ready = () => { if (gotItems && gotSettings && !S.loaded) { S.loaded = true; render("enter-fade"); } onData(); };
      unsubs.push(S.store.subscribe(S.casaId,
        arr => { S.items = new Map(arr.map(i => [i.id, i])); gotItems = true; ready(); },
        st => { S.settings = st || {}; applyRooms(); gotSettings = true; ready(); },
        err => { console.error(err); S.loaded = true; refresh(); toast(err?.code === "permission-denied" ? "Esse e-mail ainda não tem acesso a essa casa" : "Não deu pra carregar a lista"); }
      ));
      unsubs.push(S.store.watch("movs", l => { S.movs = l; onData(); }));
      unsubs.push(S.store.watch("compras", l => { S.compras = l; onData(); }));
      unsubs.push(S.store.watch("mercado", l => { S.mercado = new Map(l.map(d => [d.id, d])); onData(); }));
      unsubs.push(S.store.watchGlobal("ofertas", l => { S.ofertas = l; onData(); }));
      unsubs.push(S.store.watchGlobal("cupons", l => { S.cupons = l; onData(); }));
    } else { S.items = new Map(); S.settings = {}; S.loaded = false; applyRooms(); }
    S.route = parseRoute();
    render("enter-fade");
  });
}
/* atualização automática */
let lastCheck = 0;
async function checkUpdate() {
  if (DEMO || !/^https?:/.test(location.protocol) || Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try {
    const html = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const v = (html.match(/const APP_VERSION = "([^"]+)"/) || [])[1];
    if (!v || v === APP_VERSION) return;
    const tried = (() => { try { return sessionStorage.getItem("cozily-upd"); } catch { return null; } })();
    if (tried === v) return;
    if (document.querySelector(".overlay") || S.route?.name === "guest") { lastCheck = 0; return; }
    try { sessionStorage.setItem("cozily-upd", v); } catch {}
    location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkUpdate(); checkGarantias(); } });

S.route = parseRoute();
if (S.route.name === "guest") { startGuest(S.route.id); render("enter-fade"); }
start();
setTimeout(checkUpdate, 1500);
</script>
